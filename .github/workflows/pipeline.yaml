name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: postgres-ci-password
          POSTGRES_DB: fraud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y pocl-opencl-icd postgresql-client
          python -m pip install --upgrade pip
          pip install ruff black httpx -r backend/requirements.txt

      - name: Verificar formatação com Black
        run: black --check backend/ tests/

      - name: Executar lint com Ruff
        run: ruff check backend/ tests/

      - name: Inicializar PostgreSQL
        env:
          PGPASSWORD: postgres-ci-password
        run: |
          psql -h localhost -U fraud -d fraud_ci -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -U fraud -d fraud_ci -v ON_ERROR_STOP=1 -f database/seeds.sql

      - name: Executar testes com PostgreSQL e OpenCL
        env:
          PYTHONPATH: backend
          JWT_SECRET_KEY: "chave-ficticia-exclusiva-para-testes-ci"
          DATABASE_URL: "postgresql+psycopg://fraud:postgres-ci-password@localhost:5432/fraud_ci"
          RUN_POSTGRES_INTEGRATION: "1"
        run: pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:prod
